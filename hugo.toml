baseURL = "https://hyper-expanse.net/"
locale = "en-US"
title = "hyper-expanse"

enableRobotsTXT = true

# The site does not use tags or categories; disable the empty index pages
# that Hugo would otherwise generate.
disableKinds = ["taxonomy", "term"]

# The email signature source files are mail-client fragments, not site pages;
# exclude them from the content pipeline so Hugo neither assembles them into
# pages (its security policy rejects raw text/html) nor validates them.
ignoreFiles = [ "/content/hutson/signatures/.*" ]

cleanDestinationDir = true

# Derive page dates from Git commit metadata so manually editing front
# matter is not required when authoring or updating content.
enableGitInfo = true

[params]
  description = "The personal site of Hutson Betts: engineering guides, articles, projects, and publications on developer experience, source control, and open-source contribution."

[frontmatter]
  date = [':git', 'date', 'publishdate', 'pubdate', 'published']

[outputs]
  home = ["html", "rss"]

[imaging.avif]
  encoderSpeed = 8

[imaging.webp]
  useSharpYuv = true

# Keep attribute quotes during HTML minification so html-validate's `attr-quotes`
# rule can be enabled without requiring every template to pre-quote attributes.
[minify.tdewolff.html]
  keepQuotes = true

# Use CSS classes for syntax highlighting so code blocks don't emit inline
# styles, which `html-validate`'s `no-inline-style` rule would flag.
[markup.highlight]
  noClasses = false
