name: Pages

enable-openid-connect: true

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-deploy:
    runs-on: codeberg-small-lazy
    container:
      # TODO: Build and publish the Dev Container image to a registry so CI
      # and local development both run from a single, versioned image instead
      # of duplicating installation steps in this workflow.
      image: docker.io/debian:trixie@sha256:d07d1b51c39f51188e60be9b64e6bf769fa94e187f092bc32b91305cfa34ba5a
    steps:
      - name: Install system packages
        run: |
          set -euf -o pipefail
          apt-get update
          # Unpinned on purpose, as in .devcontainer/Containerfile. Debian drops
          # superseded packages from the archive, so exact pins stop resolving
          # once a security update replaces a package or a library that depends
          # on its exact version.
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            file \
            git \
            nodejs \
            npm \
            python3 \
            shellcheck \
            shfmt \
            weasyprint
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Hugo
        run: |
          set -euf -o pipefail
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_Linux-64bit.tar.gz" \
            -o /tmp/hugo.tar.gz \
            && echo "fea17b8c076f950bb2e9f9486667bdaa29422883888d509d63931c73e8a9b3a4  /tmp/hugo.tar.gz" | sha256sum --check --strict \
            && tar -xzf /tmp/hugo.tar.gz -C /tmp \
            && mv /tmp/hugo /usr/local/bin/hugo \
            && rm /tmp/hugo.tar.gz

      - name: Prime npm cache
        run: |
          set -euf -o pipefail
          npm ci --no-audit --no-fund --loglevel=error
          rm -rf node_modules

      - name: Install hadolint
        run: |
          set -euf -o pipefail
          curl -sSL "https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64" \
            -o /usr/local/bin/hadolint \
            && echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  /usr/local/bin/hadolint" | sha256sum --check --strict \
            && chmod +x /usr/local/bin/hadolint

      - name: Install gitleaks
        run: |
          set -euf -o pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz \
            && echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check --strict \
            && tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks \
            && mv /tmp/gitleaks /usr/local/bin/gitleaks \
            && rm /tmp/gitleaks.tar.gz

      - name: Test
        run: bash .tools/test.sh

      - name: Generate Forgejo JWT
        if: forgejo.event_name == 'push'
        id: forgejo-jwt
        env:
          AUD: ${{ vars.PAGES_AUDIENCE }}
        run: |
          set -euf -o pipefail
          jwt=$(python3 - <<'PY'
          import json, os, urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + os.environ['AUD']
          req = urllib.request.Request(url, headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          print(json.load(urllib.request.urlopen(req))['value'])
          PY
          )
          echo "::add-mask::$jwt"
          echo "jwt=$jwt" >> "$FORGEJO_OUTPUT"

      - name: Deploy
        if: forgejo.event_name == 'push'
        env:
          DEPLOY_SHA: ${{ forgejo.sha }}
          JWT: ${{ steps.forgejo-jwt.outputs.jwt }}
        run: |
          set -euf -o pipefail

          git config --global user.name "automation"
          git config --global user.email "automation@example.com"

          server="$(printf '%s' "${{ forgejo.server_url }}" | sed 's|^https://||')"
          git remote set-url origin "https://x-access-token:${JWT}@${server}/${{ forgejo.repository }}.git"

          TEMP_DIR=$(mktemp -d)
          cp -R public/. "$TEMP_DIR/"

          git branch -D pages 2>/dev/null || echo "Local pages branch doesn't exist"
          git push origin --delete pages 2>/dev/null || echo "Remote pages branch doesn't exist"

          git checkout --orphan pages

          find . \( -name .git -o -name .gitignore \) -prune -o -exec rm -rf {} + 2>/dev/null || true

          cp -R "$TEMP_DIR"/. .

          rm -rf "$TEMP_DIR"

          git add .
          git commit -m "Deploy site from commit ${DEPLOY_SHA}"

          git push origin pages
